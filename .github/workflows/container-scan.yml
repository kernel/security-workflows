name: Container Scan

# Socket Basics container image scanning. Results flow to Socket Dashboard.
#
# Socket Basics bundles Trivy for container scanning. If container scanning
# is temporarily unavailable in their pre-built action, the scan step will
# report the issue and we can fall back to standalone Trivy.

on:
  workflow_call:
    inputs:
      container-images:
        description: Comma-separated list of container images to scan (e.g. 613957054632.dkr.ecr.us-east-1.amazonaws.com/kernel/api:sha-abc1234)
        type: string
        required: false
        default: ''
      dockerfiles:
        description: Comma-separated list of Dockerfiles to scan (e.g. packages/api/Dockerfile). Auto-detected if omitted.
        type: string
        required: false
        default: ''
      aws-region:
        description: AWS region for ECR login
        type: string
        required: false
        default: 'us-east-1'
      ecr-role-to-assume:
        description: IAM role ARN to assume for ECR pull access
        type: string
        required: false
        default: ''

jobs:
  scan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        if: inputs.ecr-role-to-assume != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.ecr-role-to-assume }}
          aws-region: ${{ inputs.aws-region }}

      - name: Log in to ECR
        if: inputs.ecr-role-to-assume != ''
        uses: aws-actions/amazon-ecr-login@v2

      - name: Run Socket Basics
        uses: SocketDev/socket-basics@v2.0.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          socket_security_api_key: ${{ secrets.SOCKET_API_TOKEN }}
          container_images: ${{ inputs.container-images }}
          dockerfiles: ${{ inputs.dockerfiles }}
          socket_org: kernel
