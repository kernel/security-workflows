name: Container Scan

# Trivy container image scanning for OS and application dependency CVEs.
# Results output as table in logs + JSON artifact for audit evidence.
# LLM-powered triage posts actionable remediation to the PR.

on:
  workflow_call:
    inputs:
      image-ref:
        description: Container image to scan (e.g. 613957054632.dkr.ecr.us-east-1.amazonaws.com/kernel/api:sha-abc1234)
        type: string
        required: true
      severity:
        description: Comma-separated severities to flag (CRITICAL,HIGH,MEDIUM,LOW)
        type: string
        required: false
        default: 'CRITICAL,HIGH'
      exit-code:
        description: Exit code when vulnerabilities are found (1 to fail the build, 0 to observe only)
        type: string
        required: false
        default: '0'
      ignore-unfixed:
        description: Skip CVEs with no available patch
        type: boolean
        required: false
        default: true
      aws-region:
        description: AWS region for ECR login
        type: string
        required: false
        default: 'us-east-1'
      ecr-role-to-assume:
        description: IAM role ARN to assume for ECR pull access
        type: string
        required: false
        default: ''
      security-workflows-ref:
        description: Ref of kernel/security-workflows to fetch the triage prompt from
        type: string
        required: false
        default: main

jobs:
  scan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 15
    outputs:
      has-findings: ${{ steps.check.outputs.has_findings }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        if: inputs.ecr-role-to-assume != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.ecr-role-to-assume }}
          aws-region: ${{ inputs.aws-region }}

      - name: Log in to ECR
        if: inputs.ecr-role-to-assume != ''
        uses: aws-actions/amazon-ecr-login@v2

      - name: Scan container image (table)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ inputs.image-ref }}
          severity: ${{ inputs.severity }}
          exit-code: '0'
          ignore-unfixed: ${{ inputs.ignore-unfixed }}
          format: 'table'

      - name: Scan container image (json)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ inputs.image-ref }}
          severity: ${{ inputs.severity }}
          exit-code: ${{ inputs.exit-code }}
          ignore-unfixed: ${{ inputs.ignore-unfixed }}
          format: 'json'
          output: 'trivy-results.json'

      - name: Check for findings
        id: check
        shell: bash
        run: |
          if [ ! -f trivy-results.json ]; then
            echo "has_findings=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TOTAL=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-results.json)
          if [ "$TOTAL" = "0" ]; then
            echo "has_findings=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_findings=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Write scan summary
        if: always()
        shell: bash
        run: |
          if [ ! -f trivy-results.json ]; then
            echo "No scan results produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-results.json)
          HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-results.json)
          MEDIUM=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "MEDIUM")] | length' trivy-results.json)
          LOW=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "LOW")] | length' trivy-results.json)
          {
            echo "### Container Scan Results"
            echo "**Image:** \`${{ inputs.image-ref }}\`"
            echo ""
            echo "| Severity | Count |"
            echo "|----------|-------|"
            echo "| Critical | $CRITICAL |"
            echo "| High | $HIGH |"
            echo "| Medium | $MEDIUM |"
            echo "| Low | $LOW |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scan artifact
        uses: actions/upload-artifact@v4
        with:
          name: container-scan-report
          path: trivy-results.json
        if: always()

  triage:
    needs: scan
    if: needs.scan.outputs.has-findings == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Download scan results
        uses: actions/download-artifact@v4
        with:
          name: container-scan-report

      - name: Install Claude Code CLI
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Triage findings
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL "https://raw.githubusercontent.com/kernel/security-workflows/${{ inputs.security-workflows-ref }}/.github/workflows/container-scan/triage-prompt.md" \
            | envsubst '${GITHUB_REPOSITORY}' \
            | claude -p --model ${{ vars.CLAUDE_CODE_PREFERRED_MODEL }} --dangerously-skip-permissions --output-format text --verbose
