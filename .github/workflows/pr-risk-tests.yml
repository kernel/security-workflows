name: PR Risk Tests

on:
  pull_request:
    paths:
      - .github/workflows/pr-risk.yml
      - .github/workflows/pr-risk-tests.yml
      - .github/workflows/pr-risk/**
      - scripts/pr_risk.py
      - scripts/test_pr_risk.py
      - .github/actions/llm-credentials/**
      - scripts/test_llm_credentials.py
  push:
    branches: [main]
    paths:
      - .github/workflows/pr-risk.yml
      - .github/workflows/pr-risk-tests.yml
      - .github/workflows/pr-risk/**
      - scripts/pr_risk.py
      - scripts/test_pr_risk.py
      - .github/actions/llm-credentials/**
      - scripts/test_llm_credentials.py

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: |
          python3 -m venv /tmp/pr-risk-tests
          /tmp/pr-risk-tests/bin/pip install PyYAML==6.0.3
          /tmp/pr-risk-tests/bin/python -m unittest discover -s scripts -p test_pr_risk.py
          /tmp/pr-risk-tests/bin/python -m unittest discover -s scripts -p test_llm_credentials.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: shellcheck and actionlint
        run: |
          set -euo pipefail
          tarball=actionlint_1.7.7_linux_amd64.tar.gz
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v1.7.7/$tarball"
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $tarball" | sha256sum -c -
          tar -xzf "$tarball" actionlint
          shellcheck --version
          shellcheck .github/actions/llm-credentials/llm_credentials.sh
          # actionlint doesn't check the `run` block of a composite action.
          yq '.runs.steps[0].run' .github/actions/llm-credentials/action.yml > "$RUNNER_TEMP/action-run.sh"
          shellcheck --shell=bash "$RUNNER_TEMP/action-run.sh"
          # actionlint also runs shellcheck on each `run` block.
          ./actionlint .github/workflows/pr-risk.yml .github/workflows/pr-risk-tests.yml
