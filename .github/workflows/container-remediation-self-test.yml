name: Container Remediation Self-Test

on:
  workflow_dispatch:
    inputs:
      image-ref:
        description: Container image to scan
        required: true
        default: 'ghcr.io/kernel/api:main'

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  remediate:
    uses: ./.github/workflows/container-remediation.yml
    with:
      image-ref: ${{ inputs.image-ref }}
      go-version-file: 'test/container-remediation/go.mod'
    secrets: inherit
