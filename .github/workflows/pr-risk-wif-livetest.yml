name: pr-risk-wif-livetest
on:
  pull_request:
    branches: [hypeship/pr-risk-wif-livetest]
permissions:
  contents: read
  pull-requests: read
  id-token: write
jobs:
  classify:
    uses: ./.github/workflows/pr-risk.yml
    with:
      security-workflows-ref: hypeship/pr-risk-wif-livetest
    secrets:
      ADMIN_APP_ID: ${{ secrets.ADMIN_APP_ID }}
      ADMIN_APP_PRIVATE_KEY: ${{ secrets.ADMIN_APP_PRIVATE_KEY }}
