name: Semgrep Tests

on:
  pull_request:
    paths:
      - .github/workflows/semgrep.yml
      - .github/workflows/semgrep-tests.yml
      - scripts/semgrep_triage.py
      - scripts/test_semgrep_triage.py
  push:
    branches: [main]
    paths:
      - .github/workflows/semgrep.yml
      - .github/workflows/semgrep-tests.yml
      - scripts/semgrep_triage.py
      - scripts/test_semgrep_triage.py

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - run: |
          python3 -m venv /tmp/semgrep-tests
          /tmp/semgrep-tests/bin/pip install PyYAML==6.0.3
          /tmp/semgrep-tests/bin/python -m unittest discover -s scripts -p test_semgrep_triage.py
