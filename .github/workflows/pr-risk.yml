name: PR Risk

# Shadow-mode risk check for small pull requests. Comments whether the PR would have been
# auto-approved and why; it never approves, so a human review is still what merges a PR.
#
# A PR is skipped, with no comment, when it is a draft, comes from a fork, was opened by someone
# without write access (bots included), changes more than 50 lines, or touches a deny-listed
# path (defaults in scripts/pr_risk.py plus the caller's `deny-paths`). Otherwise a model, run
# through pi, classifies the diff and may deny it on its own judgment.
# If a PR that already has a comment becomes ineligible on a later push, the comment is
# rewritten so it never shows a stale "yes".
#
# Credentials are split by step. The model runs with no tools and no GitHub token, reading
# only the PR data gathered with the caller's read-only token. The kernel-internal token is
# minted after the model has finished, scoped to this repo and to pull-request writes.
# The model provider's credentials come from workload identity federation: the job's GitHub
# OIDC token is exchanged for short-lived provider credentials, so callers pass no API keys
# but must grant `id-token: write`.

on:
  workflow_call:
    inputs:
      deny-paths:
        description: Extra glob patterns, one per line, that make a PR ineligible
        type: string
        required: false
        default: ''
      security-workflows-ref:
        description: Ref of kernel/security-workflows to fetch the classifier script and prompt from
        type: string
        required: false
        default: main
      model:
        description: Pi model as provider/id. Defaults to the PI_PREFERRED_MODEL variable.
        type: string
        required: false
        default: ${{ vars.PI_PREFERRED_MODEL }}
    # Named rather than inherited: `secrets: inherit` would hand this cross-repo workflow
    # every secret the caller holds.
    secrets:
      ADMIN_APP_ID:
        required: true
      ADMIN_APP_PRIVATE_KEY:
        required: true
      # Ignored. Declared so callers that still pass them keep working; remove them from the
      # callers, then from here.
      ANTHROPIC_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false

jobs:
  classify:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      # For the llm-credentials action to exchange the job's OIDC token for model credentials.
      id-token: write
    concurrency:
      group: pr-risk-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      REPO: ${{ github.repository }}
      NUMBER: ${{ github.event.pull_request.number }}
      WORKDIR: /tmp/pr-risk
    steps:
      - name: Fetch classifier
        env:
          REF: ${{ inputs.security-workflows-ref }}
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/kernel/security-workflows/$REF"
          curl -fsSL "$base/scripts/pr_risk.py" -o /tmp/pr_risk.py
          curl -fsSL "$base/.github/workflows/pr-risk/classify-prompt.md" -o /tmp/pr-risk-prompt.md

      - name: Gather
        id: gather
        env:
          GH_TOKEN: ${{ github.token }}
          DENY_PATHS: ${{ inputs.deny-paths }}
        run: python3 /tmp/pr_risk.py gather --repo "$REPO" --number "$NUMBER" --dir "$WORKDIR"

      - name: Setup Node
        if: steps.gather.outputs.eligible == 'true'
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'

      - name: Install Pi
        if: steps.gather.outputs.eligible == 'true'
        env:
          PI_TELEMETRY: '0'
        run: |
          npm install -g --ignore-scripts @earendil-works/pi-coding-agent
          pi --version

      # Checked out rather than referenced as kernel/security-workflows/...@<ref>, because `uses`
      # can't take an expression and the action must follow security-workflows-ref like the
      # classifier script does.
      - name: Fetch credentials action
        id: credentials-action
        if: steps.gather.outputs.eligible == 'true'
        uses: actions/checkout@v4.2.2
        with:
          repository: kernel/security-workflows
          ref: ${{ inputs.security-workflows-ref }}
          path: .security-workflows
          sparse-checkout: .github/actions/llm-credentials
          persist-credentials: false

      - name: Model credentials
        if: steps.gather.outputs.eligible == 'true'
        uses: ./.security-workflows/.github/actions/llm-credentials
        with:
          model: ${{ inputs.model }}
          anthropic-federation-rule-id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic-organization-id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic-service-account-id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          openai-identity-provider-id: ${{ vars.OPENAI_IDENTITY_PROVIDER_ID }}
          openai-service-account-id: ${{ vars.OPENAI_SERVICE_ACCOUNT_ID }}
          openai-audience: ${{ vars.OPENAI_WIF_AUDIENCE }}

      - name: Classify
        if: steps.gather.outputs.eligible == 'true'
        env:
          MODEL: ${{ inputs.model }}
          PI_SKIP_VERSION_CHECK: '1'
          PI_TELEMETRY: '0'
        run: |
          set -euo pipefail
          # An empty directory, and no context files or project settings, so nothing but the
          # prompt and the PR data reaches the model.
          mkdir -p "$WORKDIR/cwd" && cd "$WORKDIR/cwd"
          pi --mode json --no-session --no-approve --model "$MODEL" --thinking high \
            --no-tools --no-mcp --no-extensions --no-skills --no-prompt-templates --no-context-files \
            --system-prompt /tmp/pr-risk-prompt.md \
            < "$WORKDIR/input.md" > "$WORKDIR/pi-events.jsonl"
          python3 /tmp/pr_risk.py verdict --dir "$WORKDIR"

      # Before the app's private key reaches a third-party action, so no model credential is on
      # disk or still being refreshed from here on. Also prints the refresh log.
      - name: Stop model credentials
        if: ${{ always() && steps.credentials-action.outcome == 'success' }}
        uses: ./.security-workflows/.github/actions/llm-credentials
        with:
          stop: true

      - name: Generate app token
        id: app-token
        if: ${{ !cancelled() && (steps.gather.outputs.eligible == 'true' || steps.gather.outputs.commented == 'true') }}
        # Pinned to a commit because this step is handed the app's private key. d72941d is v1.12.0.
        uses: actions/create-github-app-token@v1.12.0
        with:
          app-id: ${{ secrets.ADMIN_APP_ID }}
          private-key: ${{ secrets.ADMIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write

      - name: Comment
        if: ${{ !cancelled() && steps.app-token.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 /tmp/pr_risk.py comment --repo "$REPO" --number "$NUMBER" --dir "$WORKDIR"
