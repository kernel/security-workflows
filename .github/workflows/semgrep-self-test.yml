name: Semgrep Self-Test

on:
  pull_request:
    paths:
      - '.github/workflows/semgrep.yml'
      - '.github/workflows/semgrep-self-test.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  scan:
    uses: ./.github/workflows/semgrep.yml
    secrets: inherit
