name: Semgrep

on:
  workflow_call:
    inputs:
      extra-configs:
        description: Additional Semgrep rule configs beyond the defaults (space-separated)
        type: string
        required: false
        default: ''
      codebase-description:
        description: Brief description of the repo for the triage agent
        type: string
        required: false
        default: ''

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    container:
      # Pull through Google's unauthenticated Docker Hub mirror. Anonymous
      # Docker Hub pulls share the caller's runner IP rate limit and fail at
      # Initialize containers. Do not add a credentials block: callers that
      # don't define the referenced vars/secrets resolve to an empty value,
      # which makes the runner reject the whole template ("Unexpected value
      # ''", actions/runner#4204) for every consumer of this workflow.
      image: mirror.gcr.io/semgrep/semgrep
    outputs:
      findings_count: ${{ steps.count.outputs.findings_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --config p/secrets \
            --config p/github-actions \
            ${{ inputs.extra-configs }} \
            --severity ERROR --severity WARNING \
            --baseline-commit ${{ github.event.pull_request.base.sha }} \
            --json \
            -o semgrep-results.json || true

      - name: Count findings
        id: count
        run: |
          if command -v python3 &>/dev/null; then
            FINDINGS=$(python3 -c "import json; d=json.load(open('semgrep-results.json')); print(len([r for r in d.get('results',[]) if r.get('extra',{}).get('severity','').upper() in ('ERROR','WARNING')]))")
          elif command -v jq &>/dev/null; then
            FINDINGS=$(jq '[.results[]? | select((.extra.severity // "" | ascii_upcase) == "ERROR" or (.extra.severity // "" | ascii_upcase) == "WARNING")] | length' semgrep-results.json)
          else
            echo "Error: neither python3 nor jq available" >&2
            exit 1
          fi
          echo "findings_count=$FINDINGS" >> $GITHUB_OUTPUT

      - name: Upload results
        if: steps.count.outputs.findings_count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.json

  too-many-findings:
    runs-on: ubuntu-latest
    needs: scan
    if: needs.scan.outputs.findings_count != '0' && fromJson(needs.scan.outputs.findings_count) > 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Post volume warning
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body "**Semgrep: ${{ needs.scan.outputs.findings_count }} findings detected**

          Too many findings to triage automatically (limit: 20).

          **Next steps:**
          1. Review the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          2. Add \`// nosemgrep\` or \`.semgrepignore\` entries for accepted patterns
          3. Fix genuine issues and re-push"

  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: scan
    if: needs.scan.outputs.findings_count != '0' && fromJson(needs.scan.outputs.findings_count) <= 20
    # id-token: write is only for the llm-credentials action; the other jobs don't get it.
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    # The agent gets read-only file tools and no GitHub token. Runner steps gather the PR's
    # existing comments before it runs and post its validated result as one review after.
    env:
      REPO: ${{ github.repository }}
      NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # Semgrep scanned the merge commit, but review comments go on the PR head. Depth 2 fetches
      # both, so the findings can be moved onto the head before the agent reads it.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Download results
        uses: actions/download-artifact@v4
        with:
          name: semgrep-results

      - name: Fetch triage prompt and script
        run: |
          echo "TRIAGE_DIR=$RUNNER_TEMP/semgrep-triage" >> "$GITHUB_ENV"
          base=https://raw.githubusercontent.com/kernel/security-workflows/main
          curl -fsSL "$base/.github/workflows/semgrep-triage-prompt.md" -o "$RUNNER_TEMP/semgrep-triage-prompt.md"
          curl -fsSL "$base/scripts/semgrep_triage.py" -o "$RUNNER_TEMP/semgrep_triage.py"

      - name: Gather PR comments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 "$RUNNER_TEMP/semgrep_triage.py" gather --repo "$REPO" --number "$NUMBER" \
            --head "$HEAD_SHA" --dir "$TRIAGE_DIR" --results semgrep-results.json
          git checkout -q --detach "$HEAD_SHA"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install Pi
        env:
          PI_TELEMETRY: '0'
        run: |
          npm install -g --ignore-scripts @earendil-works/pi-coding-agent
          pi --version

      - name: Model credentials
        uses: kernel/security-workflows/.github/actions/llm-credentials@main
        with:
          model: ${{ vars.PI_PREFERRED_MODEL }}
          anthropic-federation-rule-id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic-organization-id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic-service-account-id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          openai-identity-provider-id: ${{ vars.OPENAI_IDENTITY_PROVIDER_ID }}
          openai-service-account-id: ${{ vars.OPENAI_SERVICE_ACCOUNT_ID }}
          openai-audience: ${{ vars.OPENAI_WIF_AUDIENCE }}

      - name: Triage findings
        env:
          PI_PREFERRED_MODEL: ${{ vars.PI_PREFERRED_MODEL }}
          PI_SKIP_VERSION_CHECK: '1'
          PI_TELEMETRY: '0'
          CODEBASE_DESCRIPTION: ${{ inputs.codebase-description }}
        run: |
          : "${PI_PREFERRED_MODEL:?Set the PI_PREFERRED_MODEL organization variable}"
          # shellcheck disable=SC2016 # envsubst takes the variable names literally
          envsubst '${GITHUB_REPOSITORY} ${CODEBASE_DESCRIPTION} ${TRIAGE_DIR}' \
            < "$RUNNER_TEMP/semgrep-triage-prompt.md" > "$TRIAGE_DIR/prompt.md"
          # The checkout is PR content: --no-approve keeps its .pi resources from loading and
          # --no-context-files keeps its AGENTS.md and CLAUDE.md out of the instructions.
          pi --print --no-session --no-approve --no-context-files \
            --tools read,grep,find,ls \
            --model "$PI_PREFERRED_MODEL" --thinking max \
            @"$TRIAGE_DIR/prompt.md" > "$TRIAGE_DIR/agent-output.txt"
          cat "$TRIAGE_DIR/agent-output.txt"

      - name: Stop model credentials
        if: ${{ always() }}
        uses: kernel/security-workflows/.github/actions/llm-credentials@main
        with:
          stop: true

      - name: Post review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 "$RUNNER_TEMP/semgrep_triage.py" post --repo "$REPO" --number "$NUMBER" \
            --head "$HEAD_SHA" --dir "$TRIAGE_DIR" --results semgrep-results.json
