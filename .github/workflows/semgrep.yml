name: Semgrep

on:
  workflow_call:
    inputs:
      extra-configs:
        description: Additional Semgrep rule configs beyond the defaults (space-separated)
        type: string
        required: false
        default: ''
      codebase-description:
        description: Brief description of the repo for the triage agent
        type: string
        required: false
        default: ''

jobs:
  scan:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    outputs:
      findings_count: ${{ steps.count.outputs.findings_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --config p/secrets \
            --config p/github-actions \
            ${{ inputs.extra-configs }} \
            --severity ERROR --severity WARNING \
            --baseline-commit ${{ github.event.pull_request.base.sha }} \
            --json \
            -o semgrep-results.json || true

      - name: Count findings
        id: count
        run: |
          if command -v python3 &>/dev/null; then
            FINDINGS=$(python3 -c "import json; d=json.load(open('semgrep-results.json')); print(len([r for r in d.get('results',[]) if r.get('extra',{}).get('severity','').upper() in ('ERROR','WARNING')]))")
          elif command -v jq &>/dev/null; then
            FINDINGS=$(jq '[.results[]? | select((.extra.severity // "" | ascii_upcase) == "ERROR" or (.extra.severity // "" | ascii_upcase) == "WARNING")] | length' semgrep-results.json)
          else
            echo "Error: neither python3 nor jq available" >&2
            exit 1
          fi
          echo "findings_count=$FINDINGS" >> $GITHUB_OUTPUT

      - name: Upload results
        if: steps.count.outputs.findings_count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.json

  too-many-findings:
    runs-on: ubuntu-latest
    needs: scan
    if: needs.scan.outputs.findings_count != '0' && fromJson(needs.scan.outputs.findings_count) > 20
    steps:
      - name: Post volume warning
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body "**Semgrep: ${{ needs.scan.outputs.findings_count }} findings detected**

          Too many findings to triage automatically (limit: 20).

          **Next steps:**
          1. Review the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          2. Add \`// nosemgrep\` or \`.semgrepignore\` entries for accepted patterns
          3. Fix genuine issues and re-push"

  triage:
    runs-on: ubuntu-latest
    needs: scan
    if: needs.scan.outputs.findings_count != '0' && fromJson(needs.scan.outputs.findings_count) <= 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download results
        uses: actions/download-artifact@v4
        with:
          name: semgrep-results

      - name: Install Claude Code CLI
        run: curl -fsSL https://claude.ai/install.sh | bash

      - name: Triage findings
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export CODEBASE_DESCRIPTION="${{ inputs.codebase-description }}"
          curl -fsSL https://raw.githubusercontent.com/kernel/security-workflows/main/.github/workflows/semgrep-triage-prompt.md | envsubst '${GITHUB_REPOSITORY} ${CODEBASE_DESCRIPTION}' | claude -p --model ${{ vars.CLAUDE_CODE_PREFERRED_MODEL }} --dangerously-skip-permissions --output-format text --verbose
