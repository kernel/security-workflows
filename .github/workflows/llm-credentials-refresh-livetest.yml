name: llm-credentials-refresh-livetest
on:
  push:
    branches: [hypeship/pr-risk-wif-livetest]
permissions:
  contents: read
  id-token: write
jobs:
  refresh:
    strategy:
      matrix:
        model: [openai/gpt-6-luna, anthropic/claude-haiku-5-5]
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
      ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
      ANTHROPIC_IDENTITY_TOKEN_FILE: /tmp/anthropic-identity-token
      OPENAI_IDENTITY_PROVIDER_ID: ${{ vars.OPENAI_IDENTITY_PROVIDER_ID }}
      OPENAI_SERVICE_ACCOUNT_ID: ${{ vars.OPENAI_SERVICE_ACCOUNT_ID }}
      OPENAI_WIF_AUDIENCE: ${{ vars.OPENAI_WIF_AUDIENCE }}
      MODEL: ${{ matrix.model }}
      PI_TELEMETRY: '0'
      PI_SKIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent >/dev/null
      - name: Start credentials
        run: |
          bash scripts/llm_credentials.sh start "${MODEL%%/*}"
          stat -c '%y %n' /tmp/anthropic-identity-token ~/.pi/agent/auth.json 2>/dev/null || true
      - name: Wait past the first credential's expiry
        run: sleep 400
      - name: Call the model with refreshed credentials
        run: |
          stat -c '%y %n' /tmp/anthropic-identity-token ~/.pi/agent/auth.json 2>/dev/null || true
          cat "$RUNNER_TEMP/llm-credentials.log" 2>/dev/null || true
          echo "Reply with exactly: refreshed ok" | pi --print --no-session --no-tools --no-mcp \
            --no-extensions --no-skills --no-context-files --model "$MODEL"
