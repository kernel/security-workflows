name: Vulnerability Remediation

on:
  workflow_call:
    inputs:
      go-version-file:
        description: Path to any go.mod for Go version detection (empty to skip Go)
        type: string
        required: false
        default: ''
      setup-bun:
        description: Whether to setup Bun
        type: boolean
        required: false
        default: false
      setup-python:
        description: Whether to setup Python and uv
        type: boolean
        required: false
        default: false
      python-version:
        description: Python version to install
        type: string
        required: false
        default: '3.11'
      security-workflows-ref:
        description: Ref of kernel/security-workflows to fetch shared scripts and prompts from
        type: string
        required: false
        default: main

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.ADMIN_APP_ID }}
          private-key: ${{ secrets.ADMIN_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Install Socket CLI
        run: npm install -g @socketsecurity/cli

      - name: Run Socket scan
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_API_TOKEN }}
        run: |
          echo "Socket CLI version: $(socket --version 2>/dev/null || echo unknown)"
          for ATTEMPT in 1 2 3; do
            echo "Scan attempt $ATTEMPT/3..."
            set +e
            socket scan create \
              --org=kernel \
              --repo="${{ github.event.repository.name }}" \
              --branch=main \
              --default-branch \
              --report \
              --report-level=warn \
              --json \
              --fold=version \
              --no-interactive \
              > socket-raw.json 2>&1
            SCAN_EXIT=$?
            set -e
            echo "Socket scan exit code: $SCAN_EXIT"
            if [ $SCAN_EXIT -eq 0 ]; then
              break
            fi
            echo "::warning::Socket scan attempt $ATTEMPT failed (exit $SCAN_EXIT):"
            cat socket-raw.json || true
            if [ $ATTEMPT -lt 3 ]; then
              echo "Retrying in 15s..."
              sleep 15
            fi
          done
          if [ $SCAN_EXIT -ne 0 ]; then
            echo "::error::Socket scan failed after 3 attempts"
            echo '{"healthy":true,"alerts":{}}' > socket-report.json
          else
            # Socket CLI v1.x mixes progress text with JSON on stdout.
            # Extract the JSON object that starts with {"ok": or {"healthy":
            if jq empty socket-raw.json 2>/dev/null; then
              cp socket-raw.json socket-report.json
            elif grep -q '"ok"' socket-raw.json; then
              # Extract from first { to end, then pull .data if wrapped in {ok, data}
              sed -n '/^{/,$p' socket-raw.json > socket-extracted.json
              if jq empty socket-extracted.json 2>/dev/null; then
                HAS_DATA=$(jq 'has("data")' socket-extracted.json 2>/dev/null || echo "false")
                if [ "$HAS_DATA" = "true" ]; then
                  jq '.data' socket-extracted.json > socket-report.json
                else
                  cp socket-extracted.json socket-report.json
                fi
              else
                echo "::warning::Could not extract valid JSON from Socket output"
                echo '{"healthy":true,"alerts":{}}' > socket-report.json
              fi
            else
              echo "::warning::Socket output is not valid JSON:"
              head -20 socket-raw.json
              echo '{"healthy":true,"alerts":{}}' > socket-report.json
            fi
            ALERT_COUNT=$(jq '.alerts | if type == "object" then length elif type == "array" then length else 0 end' socket-report.json 2>/dev/null || echo "0")
            echo "Socket scan succeeded. Alert count: $ALERT_COUNT"
          fi

      - name: Upload scan report
        uses: actions/upload-artifact@v4
        with:
          name: socket-report
          path: socket-report.json

      - name: Normalize Socket report
        run: |
          curl -fsSL https://raw.githubusercontent.com/kernel/security-workflows/${{ inputs.security-workflows-ref }}/scripts/vuln_remediation.py -o /tmp/vuln_remediation.py
          python3 /tmp/vuln_remediation.py normalize \
            --input socket-report.json \
            --output remediation-input.json

      - name: Upload normalized remediation input
        uses: actions/upload-artifact@v4
        with:
          name: remediation-input
          path: remediation-input.json

  triage:
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download normalized remediation input
        uses: actions/download-artifact@v4
        with:
          name: remediation-input

      - name: Install Socket CLI
        run: npm install -g @socketsecurity/cli

      - name: Ask Socket for a fix plan
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_API_TOKEN }}
        run: |
          set +e
          socket fix . \
            --all \
            --no-apply-fixes \
            --no-major-updates \
            --show-affected-direct-dependencies \
            --json \
            --output-file socket-fix-plan.json
          FIX_PLAN_EXIT=$?
          set -e
          if [ $FIX_PLAN_EXIT -ne 0 ] || ! jq empty socket-fix-plan.json 2>/dev/null; then
            echo "::warning::Socket fix planning failed; manager will defer unplanned or insufficiently described fixes."
            echo '{}' > socket-fix-plan.json
          fi

      - name: Build remediation context
        run: |
          curl -fsSL https://raw.githubusercontent.com/kernel/security-workflows/${{ inputs.security-workflows-ref }}/scripts/vuln_remediation.py -o /tmp/vuln_remediation.py
          python3 /tmp/vuln_remediation.py build-context \
            --input remediation-input.json \
            --fix-plan socket-fix-plan.json \
            --output remediation-context.json
          cp remediation-context.json triage-result.json

      - name: Upload triage results
        uses: actions/upload-artifact@v4
        with:
          name: triage-result
          path: |
            triage-result.json
            remediation-context.json
            socket-fix-plan.json

  fix:
    needs: triage
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.ADMIN_APP_ID }}
          private-key: ${{ secrets.ADMIN_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Download triage results
        uses: actions/download-artifact@v4
        with:
          name: triage-result

      - name: Check for fixable alerts
        id: check
        run: |
          if ! [ -f remediation-context.json ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          FIX_COUNT=$(jq '.fixes | length' remediation-context.json 2>/dev/null || echo "0")
          if [ "$FIX_COUNT" = "0" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Configure git identity and private module access
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "kernel-internal[bot]"
          git config user.email "260533166+kernel-internal[bot]@users.noreply.github.com"
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "https://github.com/"
        env:
          GOPRIVATE: github.com/kernel/*

      - name: Reset remediation branch to main
        if: steps.check.outputs.skip != 'true'
        run: |
          git checkout -B security/vuln-remediation origin/main

      - name: Setup Go
        if: steps.check.outputs.skip != 'true' && inputs.go-version-file != ''
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ inputs.go-version-file }}
        env:
          GOPRIVATE: github.com/kernel/*

      - name: Setup Bun
        if: steps.check.outputs.skip != 'true' && inputs.setup-bun
        uses: oven-sh/setup-bun@v2

      - name: Install JS dependencies
        if: steps.check.outputs.skip != 'true' && inputs.setup-bun
        run: bun install

      - name: Setup Python
        if: steps.check.outputs.skip != 'true' && inputs.setup-python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install uv
        if: steps.check.outputs.skip != 'true' && inputs.setup-python
        run: pip install uv

      - name: Install Cursor CLI
        if: steps.check.outputs.skip != 'true'
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> $GITHUB_PATH

      - name: Install Socket CLI
        if: steps.check.outputs.skip != 'true'
        run: npm install -g @socketsecurity/cli

      - name: Apply fixes
        if: steps.check.outputs.skip != 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GOPRIVATE: github.com/kernel/*
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_API_TOKEN }}
        run: |
          set +e
          socket fix . \
            --all \
            --no-major-updates \
            --json \
            --output-file socket-fix-apply.json
          SOCKET_FIX_EXIT=$?
          set -e
          if [ $SOCKET_FIX_EXIT -ne 0 ]; then
            echo "::warning::Socket fix failed; invoking bounded fallback agent."
          fi

          if git diff --quiet; then
            export DATE="$(date -u +%Y-%m-%d)"
            curl -fsSL https://raw.githubusercontent.com/kernel/security-workflows/${{ inputs.security-workflows-ref }}/.github/workflows/vuln-remediation/fix-prompt.md | envsubst '${GITHUB_REPOSITORY} ${DATE}' | agent -p --model ${{ secrets.CURSOR_PREFERRED_MODEL }} --workspace . --trust --force --output-format=text
          fi

      - name: Validate remediation diff
        id: diff
        if: steps.check.outputs.skip != 'true'
        run: |
          curl -fsSL https://raw.githubusercontent.com/kernel/security-workflows/${{ inputs.security-workflows-ref }}/scripts/vuln_remediation.py -o /tmp/vuln_remediation.py
          git diff --name-only > changed-files.txt
          if [ ! -s changed-files.txt ]; then
            echo '{"fixed": [], "reverted": [], "summary": "No dependency changes were produced."}' > fix-result.json
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "has_changes=true" >> $GITHUB_OUTPUT
          python3 /tmp/vuln_remediation.py validate-diff \
            --repo-root . \
            --context remediation-context.json \
            --changed-files changed-files.txt \
            --output diff-validation.json

      - name: Build post-fix Socket plan
        if: steps.check.outputs.skip != 'true' && steps.diff.outputs.has_changes == 'true'
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_API_TOKEN }}
        run: |
          set +e
          socket fix . \
            --all \
            --no-apply-fixes \
            --no-major-updates \
            --show-affected-direct-dependencies \
            --json \
            --output-file post-fix-plan.json
          POST_PLAN_EXIT=$?
          set -e
          if [ $POST_PLAN_EXIT -ne 0 ] || ! jq empty post-fix-plan.json 2>/dev/null; then
            echo "::warning::Post-fix Socket planning failed; confirmation will fail closed."
            echo '{"fixes":{"__post_fix_plan_failed__":{}}}' > post-fix-plan.json
          fi

      - name: Confirm fixes
        if: steps.check.outputs.skip != 'true' && steps.diff.outputs.has_changes == 'true'
        run: |
          set +e
          python3 /tmp/vuln_remediation.py confirm \
            --repo-root . \
            --context remediation-context.json \
            --post-fix-plan post-fix-plan.json \
            --output confirmation-result.json
          CONFIRM_EXIT=$?
          set -e
          python3 /tmp/vuln_remediation.py summarize-fix \
            --context remediation-context.json \
            --confirmation confirmation-result.json \
            --output fix-result.json
          exit $CONFIRM_EXIT

      - name: Commit and push validated changes
        if: steps.check.outputs.skip != 'true' && steps.diff.outputs.has_changes == 'true'
        run: |
          if ! jq -e '.fixed | length > 0' fix-result.json >/dev/null; then
            echo "No confirmed fixes to commit."
            exit 0
          fi
          git add --pathspec-from-file=changed-files.txt
          git diff --cached --quiet && exit 0
          git commit -m "security: vulnerability remediation ($(date -u +%Y-%m-%d))"
          git push --force-with-lease origin security/vuln-remediation

      - name: Upload fix results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fix-result
          path: |
            fix-result.json
            confirmation-result.json
            diff-validation.json
            changed-files.txt
            socket-fix-apply.json
            post-fix-plan.json
          if-no-files-found: ignore

  pr:
    needs: [triage, fix]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.ADMIN_APP_ID }}
          private-key: ${{ secrets.ADMIN_APP_PRIVATE_KEY }}

      - name: Download triage results
        uses: actions/download-artifact@v4
        with:
          name: triage-result
        continue-on-error: true

      - name: Download fix results
        uses: actions/download-artifact@v4
        with:
          name: fix-result
        continue-on-error: true

      - name: Render PR body
        run: |
          curl -fsSL https://raw.githubusercontent.com/kernel/security-workflows/${{ inputs.security-workflows-ref }}/scripts/vuln_remediation.py -o /tmp/vuln_remediation.py
          [ -f triage-result.json ] || echo '{"deferred":[]}' > triage-result.json
          [ -f fix-result.json ] || echo '{"fixed":[],"reverted":[]}' > fix-result.json
          [ -f confirmation-result.json ] || echo '{"ok":false,"confirmed":[],"failures":[]}' > confirmation-result.json
          python3 /tmp/vuln_remediation.py render-pr-body \
            --triage triage-result.json \
            --fix-result fix-result.json \
            --confirmation confirmation-result.json \
            --output pr-body.md

      - name: Create or update PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ "${{ needs.fix.result }}" != "success" ]; then
            echo "Fix job did not complete successfully; not creating or updating a remediation PR."
            exit 0
          fi
          REPO="${{ github.repository }}"
          if ! jq -e '.fixed | length > 0' fix-result.json >/dev/null 2>&1; then
            echo "No confirmed fixes; not creating a PR."
            exit 0
          fi

          EXISTING_PR=$(gh pr list --repo "$REPO" --head security/vuln-remediation --state open --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING_PR" ] && [ "$EXISTING_PR" != "null" ]; then
            gh pr edit "$EXISTING_PR" --repo "$REPO" --body-file pr-body.md --add-assignee ulziibay-kernel --add-reviewer ulziibay-kernel
            echo "Updated PR #${EXISTING_PR}"
          else
            gh pr create \
              --repo "$REPO" \
              --head security/vuln-remediation \
              --base main \
              --title "security: vulnerability remediation" \
              --assignee ulziibay-kernel \
              --reviewer ulziibay-kernel \
              --body-file pr-body.md
          fi
