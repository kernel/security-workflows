name: llm-credentials-livetest
on:
  push:
    branches: [hypeship/llm-credentials-livetest]
permissions:
  contents: read
  id-token: write
jobs:
  refresh:
    strategy:
      matrix:
        model: [openai/gpt-6-luna, anthropic/claude-haiku-5-5]
    runs-on: ubuntu-latest
    env:
      PI_TELEMETRY: '0'
      PI_SKIP_VERSION_CHECK: '1'
      MODEL: ${{ matrix.model }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent >/dev/null
      - uses: kernel/security-workflows/.github/actions/llm-credentials@hypeship/llm-credentials-livetest
        with:
          model: ${{ matrix.model }}
          anthropic-federation-rule-id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic-organization-id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic-service-account-id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          openai-identity-provider-id: ${{ vars.OPENAI_IDENTITY_PROVIDER_ID }}
          openai-service-account-id: ${{ vars.OPENAI_SERVICE_ACCOUNT_ID }}
          openai-audience: ${{ vars.OPENAI_WIF_AUDIENCE }}
      - name: Wait past the first credential's expiry
        run: sleep 400
      - name: Call the model with refreshed credentials
        run: |
          test -z "${ANTHROPIC_API_KEY:-}${OPENAI_API_KEY:-}"
          echo "Reply with exactly: refreshed ok" | pi --print --no-session --no-tools --no-mcp \
            --no-extensions --no-skills --no-context-files --model "$MODEL"
      - uses: kernel/security-workflows/.github/actions/llm-credentials@hypeship/llm-credentials-livetest
        with:
          stop: true
      - name: Credentials are gone after stop
        run: |
          set -euxo pipefail
          test ! -e "$RUNNER_TEMP/anthropic-identity-token"
          test ! -e "$RUNNER_TEMP/llm-credentials.pid"
          if jq -e .openai ~/.pi/agent/auth.json 2>/dev/null; then exit 1; fi
          if pgrep -f 'llm_credentials.sh loop'; then exit 1; fi
          sleep 40
          test ! -e "$RUNNER_TEMP/anthropic-identity-token"
          if jq -e .openai ~/.pi/agent/auth.json 2>/dev/null; then exit 1; fi
          echo "credentials stayed deleted"
